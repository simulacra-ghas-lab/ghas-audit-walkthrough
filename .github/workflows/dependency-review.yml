# Stands in for the Sonatype policy gate at pull-request time.
#
# This is NOT Sonatype. It demonstrates the same control shape -- an SCA policy
# evaluated on the diff, failing the PR when a dependency crosses a severity
# threshold. Say so out loud during the demo.

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
