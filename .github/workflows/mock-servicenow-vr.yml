# Mock ServiceNow Vulnerability Response integration.
#
# Creates a GitHub Issue shaped like a VR record so the walkthrough can answer
# "at what point is a vulnerability created and sent to ServiceNow VR?" with
# something concrete on screen. No ServiceNow instance is contacted.
#
# WHY THIS POLLS RATHER THAN LISTENING FOR ALERTS
# GitHub Actions cannot be triggered by security alert events. `on:
# code_scanning_alert` (and secret_scanning_alert, dependabot_alert) is not a
# valid workflow trigger -- a workflow declaring one fails to compile and
# produces a run with zero jobs. Verified on this repo.
#
# That is also how the real integration works: ServiceNow VR pulls from the
# GitHub APIs (or receives a webhook server-side), it does not run inside
# Actions. Polling here is the faithful shape, not a workaround.
#
# Swap the issue creation for a POST to /api/now/table/sn_vul_vulnerable_item
# when wiring a real instance.

name: Mock ServiceNow VR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull open findings and raise VR records
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const SLA = { critical: 7, high: 30, medium: 90, low: 180 };

            // Existing records, so re-runs don't duplicate.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: 'servicenow-vr', per_page: 100
            });
            const known = new Set(
              existing.map(i => (i.body || '').match(/vr-fp:([^\s]+)/)?.[1]).filter(Boolean)
            );

            const findings = [];

            // --- CodeQL -------------------------------------------------
            try {
              const alerts = await github.paginate(
                'GET /repos/{owner}/{repo}/code-scanning/alerts',
                { owner, repo, state: 'open', per_page: 100 });
              for (const a of alerts) {
                findings.push({
                  fp: `code-scanning-${a.number}`,
                  source: 'GitHub Advanced Security / CodeQL',
                  title: a.rule?.description || a.rule?.id || 'Code scanning finding',
                  severity: a.rule?.security_severity_level || 'medium',
                  cve: 'n/a',
                  asset: a.most_recent_instance?.location?.path || 'source',
                  url: a.html_url
                });
              }
            } catch (e) { core.warning(`code scanning: ${e.message}`); }

            // --- Dependabot (stands in for Sonatype) --------------------
            try {
              const alerts = await github.paginate(
                'GET /repos/{owner}/{repo}/dependabot/alerts',
                { owner, repo, state: 'open', per_page: 100 });
              for (const a of alerts) {
                findings.push({
                  fp: `dependabot-${a.number}`,
                  source: 'Dependabot (stands in for Sonatype)',
                  title: `Vulnerable dependency: ${a.dependency?.package?.name}`,
                  severity: a.security_advisory?.severity || 'medium',
                  cve: a.security_advisory?.cve_id || 'n/a',
                  asset: a.dependency?.manifest_path || 'package.json',
                  url: a.html_url
                });
              }
            } catch (e) { core.warning(`dependabot: ${e.message}`); }

            // --- Secret scanning ----------------------------------------
            try {
              const alerts = await github.paginate(
                'GET /repos/{owner}/{repo}/secret-scanning/alerts',
                { owner, repo, state: 'open', per_page: 100 });
              for (const a of alerts) {
                findings.push({
                  fp: `secret-scanning-${a.number}`,
                  source: 'GitHub Advanced Security / Secret Scanning',
                  title: `Exposed credential: ${a.secret_type_display_name || a.secret_type}`,
                  severity: 'critical',
                  cve: 'n/a',
                  asset: 'repository',
                  url: a.html_url
                });
              }
            } catch (e) { core.warning(`secret scanning: ${e.message}`); }

            core.notice(`${findings.length} open finding(s); ${known.size} already tracked.`);

            let created = 0;
            for (const f of findings) {
              if (known.has(f.fp)) continue;

              const days = SLA[f.severity] ?? 90;
              const due  = new Date(Date.now() + days * 864e5).toISOString().slice(0, 10);
              const vr   = `VR${String(Date.now()).slice(-7)}`;

              const body = [
                `<!-- vr-fp:${f.fp} -->`,
                `> Mock record. No ServiceNow instance was contacted.`,
                ``,
                `| Field | Value |`,
                `| --- | --- |`,
                `| Number | \`${vr}\` |`,
                `| State | New |`,
                `| Source | ${f.source} |`,
                `| CVE | ${f.cve} |`,
                `| Severity | **${f.severity}** |`,
                `| Remediation SLA | ${days} days |`,
                `| Due | ${due} |`,
                `| Configuration item | ${owner}/${repo} |`,
                `| Affected asset | \`${f.asset}\` |`,
                `| Assignment group | Application Security |`,
                `| Detected | ${new Date().toISOString()} |`,
                ``,
                f.url ? `**Originating alert:** ${f.url}` : '',
                ``,
                `---`,
                `In production the ServiceNow VR GitHub integration opens a Vulnerable`,
                `Item from this finding and starts the remediation SLA clock above.`
              ].join('\n');

              await github.rest.issues.create({
                owner, repo,
                title: `[${vr}] ${f.title}`,
                body,
                labels: ['servicenow-vr', 'vulnerability', `severity:${f.severity}`]
              });
              created++;
            }

            core.notice(`Created ${created} new VR record(s).`);
